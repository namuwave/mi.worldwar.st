<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="두 차례의 세계대전, 인권과 평화를 살펴보는 중학교 2학년 역사 수업">
  <title>세계대전 기록실 · 학생용</title>
  <style>
:root {
  color-scheme: light;
  --paper: #f5f4ef;
  --white: #fff;
  --ink: #182e2c;
  --muted: #52645f;
  --line: #d5ddd7;
  --forest: #173d37;
  --forest-deep: #102d29;
  --mint: #deeee6;
  --rust: #a63e2a;
  --rust-soft: #f8e4d9;
  --focus: #a74319;
  --radius: 18px;
  --korean: "Noto Sans KR", "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 0;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--korean);
  font-size: 1rem;
  line-height: 1.65;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-text-size-adjust: 100%;
}

button, input, textarea { font: inherit; }
button { color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
[tabindex="-1"]:focus { outline: none; }
[hidden] { display: none !important; }
img { display: block; max-width: 100%; }
h1, h2, h3, p, figure { margin: 0; }
h1, h2, h3 { line-height: 1.32; letter-spacing: -.042em; }
p + p { margin-top: .7em; }
small { font-size: .88rem; }

.shell { width: min(1280px, calc(100% - 64px)); margin-inline: auto; }
.skip {
  position: fixed; top: 8px; left: 8px; z-index: 10;
  transform: translateY(-160%); padding: .5rem 1rem;
  background: var(--white); color: var(--forest);
}
.skip:focus { transform: translateY(0); }

.masthead { background: var(--white); border-bottom: 1px solid var(--line); }
.masthead .shell {
  min-height: 72px; display: flex; align-items: center;
  justify-content: space-between; gap: 12px 24px; flex-wrap: wrap;
}
.wordmark { display: inline-flex; gap: .68rem; align-items: center; text-decoration: none; font-weight: 800; }
.brand-mark {
  display: inline-grid; place-items: center; width: 32px; height: 32px;
  border-radius: 8px; background: var(--forest); color: #fff; flex: none;
}
.brand-mark::after {
  content: ""; width: 15px; height: 14px; border: 1.5px solid currentColor;
  border-radius: 2px; background: repeating-linear-gradient(to bottom, transparent 0 3px, currentColor 3px 4px, transparent 4px 5px);
  box-shadow: 3px 3px 0 -1px var(--forest), 4px 4px 0 -1px currentColor;
}

.row { display: flex; flex-wrap: wrap; align-items: center; gap: .65rem; }
.eyebrow { color: var(--rust); font-size: .88rem; font-weight: 750; }
.muted { color: var(--muted); }
.pill {
  display: inline-flex; align-items: center; border-radius: 999px;
  padding: .21rem .63rem; color: var(--forest); background: var(--mint);
  font-size: .88rem; font-weight: 750; line-height: 1.45;
}
.btn {
  display: inline-flex; justify-content: center; align-items: center; min-height: 44px;
  padding: .52rem .95rem; border: 1px solid var(--line); border-radius: 9px;
  background: var(--white); color: var(--ink); text-decoration: none;
  font-weight: 750; text-align: center; line-height: 1.45;
}
.btn:hover { border-color: var(--forest); }
.btn.primary { background: var(--forest); border-color: var(--forest); color: #fff; }
.btn.primary:hover { background: var(--forest-deep); }
.btn[aria-current="page"], .btn[aria-pressed="true"] { background: var(--mint); border-color: #6d9183; color: var(--forest); }
.btn:disabled { opacity: .55; }

.credits { margin-top: 2.5rem; padding: 1.5rem 0 2rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
.credits h2 { margin-bottom: .45rem; color: var(--ink); font-size: 1.12rem; }
.credits details { margin-top: .55rem; }
summary { cursor: pointer; font-weight: 750; color: var(--forest); }
.source-list { columns: 2; column-gap: 2rem; padding-left: 1.25rem; margin: .7rem 0 0; }
.source-list li { break-inside: avoid; margin: 0 0 .35rem; }
.source-list a, .inline-source { color: #25594c; text-underline-offset: .16em; }
.source-list a:hover, .inline-source:hover { color: var(--rust); }

.paper-visual { border: 1px solid var(--line); background: #edf1eb; border-radius: 12px; overflow: hidden; }
.paper-visual figcaption { padding: .48rem .75rem; background: #fff; color: var(--muted); font-size: .86rem; }

.map-legend { display: flex; flex-wrap: wrap; gap: .4rem .8rem; color: var(--muted); font-size: .88rem; }
.map-key { display: inline-flex; align-items: center; gap: .38rem; }
.swatch { display: inline-block; width: .83rem; height: .83rem; border: 1px solid #7a5147; border-radius: .18rem; background: #d47a5f; flex: none; }
.swatch.postwar { background: #8bb9a5; border-color: #4c7767; }

.feedback {
  padding: .72rem .9rem; border-radius: 9px; background: var(--rust-soft); color: #713021;
  border: 1px solid #e8bdab; font-weight: 650;
}
.feedback.good { background: var(--mint); color: #1c4b3d; border-color: #b3d1c4; }

@media (max-width: 720px) {
  .shell { width: calc(100% - 30px); }
  .source-list { columns: 1; }
  .credits { margin-top: 1.65rem; }
}

.game-home, .activity { padding-top: 1.55rem; }
.archive-hero {
  display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr);
  background: var(--forest-deep); color: #fff; border-radius: var(--radius); overflow: hidden;
}
.archive-hero div { padding: clamp(1.6rem, 3.6vw, 3.1rem); align-self: center; }
.archive-hero .eyebrow { color: #afe0cd; }
.archive-hero h1 { font-size: clamp(2rem, 4.25vw, 3.7rem); margin: .25rem 0 .65rem; }
.archive-hero p:not(.eyebrow) { color: #e4ede6; font-size: 1.12rem; max-width: 31rem; }
.archive-hero figure { min-width: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
.archive-hero img { width: 100%; height: 100%; min-height: 205px; max-height: 245px; object-fit: cover; object-position: 53% 50%; }
.archive-hero figcaption { font-size: .82rem; color: #e4ede6; background: #20453b; padding: .26rem .75rem; }

.game-section { margin-top: 1.65rem; }
.game-section h2 { font-size: clamp(1.22rem, 2.3vw, 1.65rem); margin: 0 0 .6rem; }
.game-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .8rem; }
.game-card {
  min-width: 0; display: grid; grid-template-columns: auto 1fr; align-items: start;
  gap: 1rem; padding: .95rem; background: #fff; border: 1px solid var(--line); border-radius: 13px;
  text-decoration: none;
}
.game-card:hover { border-color: #5a8b76; box-shadow: 0 4px 16px #133e3010; }
.game-card h3 { margin: .3rem 0 .3rem; font-size: clamp(1.08rem, 2.05vw, 1.42rem); }
.game-card p { line-height: 1.5; color: var(--muted); }
.thumbnail {
  display: grid; place-items: center; width: clamp(50px, 8vw, 79px); aspect-ratio: 1;
  border-radius: 10px; font-size: 1.05rem; font-weight: 800; background: #daede5; color: #194638;
}
.thumbnail.documents { background: #f3e6d5; color: #694231; }
.thumbnail.testimony { background: #ece5d8; color: #574935; }
.thumbnail.peace { background: #dfeaf0; color: #284e60; }

.activity { width: min(100%, 1000px); margin-inline: auto; }
.activity-top { padding: 1rem 1.25rem 1.12rem; border-radius: 14px; background: var(--forest-deep); color: #fff; margin-bottom: .8rem; }
.activity-top .eyebrow { color: #afe0cd; }
.activity-top h1 { font-size: clamp(1.75rem, 3.6vw, 2.65rem); margin: .2rem 0 .5rem; }
.activity-top > p:last-child { color: #e3eee6; }
.task, .completion { padding: clamp(.85rem, 2.6vw, 1.5rem); border: 1px solid var(--line); border-radius: 14px; background: #fff; }
.task h2, .completion h2 { font-size: clamp(1.23rem, 2.6vw, 1.6rem); margin-bottom: .5rem; }
.task h3 { font-size: 1.07rem; margin-bottom: .34rem; }
.task .feedback { margin: .75rem 0 0; }
.task .sources { margin-top: .8rem; color: var(--muted); font-size: .9rem; display: flex; align-items: start; flex-wrap: wrap; gap: .45rem .8rem; }
.action-row { margin-top: .8rem; }
.two-up { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .72rem; }
.panel { border: 1px solid var(--line); border-radius: 10px; background: #f6f7f1; padding: .8rem; min-width: 0; }
.panel p { margin: .4rem 0 0; }
.choice-list { display: grid; gap: .46rem; }
.choice {
  min-height: 44px; width: 100%; padding: .58rem .67rem; border: 1px solid #c9d7cf; border-radius: 8px;
  text-align: left; line-height: 1.55; background: #fff; color: var(--ink);
}
.choice:hover { border-color: #5c8a78; }
.choice[aria-pressed="true"] { background: #ddede3; border-color: #598573; box-shadow: inset 3px 0 0 #54816e; }
.choice small { display: block; color: var(--muted); font-size: .8rem; font-weight: 700; margin-bottom: .12rem; }
.quotation { margin: .55rem 0; color: var(--muted); font-size: .9rem; }

.map-columns { display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(0, .82fr); gap: .85rem; align-items: start; margin-top: .8rem; }
.map-frame { position: relative; margin-top: .55rem; }
.map-frame img { width: 100%; height: auto; }
.map-frame .pin {
  position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%);
  display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
  background: #fff; border: 2px solid #33534a; color: #193b31; box-shadow: 0 2px 7px #172e2c25;
  font-weight: 850; touch-action: manipulation;
}
.map-frame .pin:hover, .map-frame .pin[aria-pressed="true"] { background: var(--forest); color: #fff; }
.map-key-button { display: flex; gap: .55rem; align-items: center; }
.pin-code { background: #e3eee6; border-radius: 6px; color: #25483d; font-size: .88rem; font-weight: 800; padding: .05rem .43rem; flex: none; }
.map-columns .map-legend { margin-top: .55rem; }
.map-instructions { margin: 0 0 .7rem; font-weight: 750; }

.folder-grid { margin-top: .75rem; }
.folder {
  border: 1px solid #b8ccbd; background: #e9f1e9; padding: .62rem;
  border-radius: 8px; color: var(--ink); min-width: 0;
}
.folder:nth-child(2) { background: #eef0e1; border-color: #cbd0b9; }
.folder p { margin-top: .4rem; font-size: .9rem; color: var(--muted); }
.folder-button { width: 100%; text-align: left; justify-content: flex-start; font-size: .93rem; }
.fragments { margin-top: .7rem; }
.fragments .choice { height: 100%; }
.folder-count { font-size: .85rem; margin-left: auto; color: var(--muted); padding-left: .4rem; white-space: nowrap; }
.placed { margin: .4rem 0 0; padding-left: 1.2rem; font-size: .88rem; line-height: 1.45; }
.placed li + li { margin-top: .28rem; }

.record-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .45rem; margin: .75rem 0; }
.record-detail { margin: .8rem 0; }
.record-detail li + li { margin-top: .25rem; }
.record-detail ul { padding-left: 1.23rem; margin: .55rem 0; }
.note-form { border-top: 1px solid var(--line); margin-top: .9rem; padding-top: .8rem; }
.note-form label { display: block; font-weight: 750; }
.note-form textarea {
  display: block; width: 100%; margin-top: .55rem; border: 1px solid #7e9c8d; border-radius: 8px;
  padding: .65rem; min-height: 5rem; resize: vertical; background: #fff; line-height: 1.5; color: var(--ink);
}
.note-form > p { font-size: .92rem; color: var(--muted); }

.completion h2 { margin-top: .3rem; }
.completion .record-caption { margin: .8rem 0; padding: .8rem .92rem; border-radius: 10px; border-left: 4px solid #6b9c86; background: #edf4ed; white-space: pre-line; }
.result-explain { margin-top: .75rem; }
.result-sources { margin-top: .7rem; display: flex; flex-wrap: wrap; gap: .45rem .8rem; font-size: .91rem; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

@media (max-width: 760px) {
  .map-columns { grid-template-columns: 1fr; }
  .map-frame { max-width: 100%; }
}
@media (max-width: 560px) {
  .masthead .shell { min-height: 62px; }
  .game-home, .activity { padding-top: .85rem; }
  .archive-hero, .game-cards, .record-list { grid-template-columns: minmax(0, 1fr); }
  .archive-hero img { min-height: 115px; max-height: 155px; object-position: 50% 55%; }
  .game-section { margin-top: 1.25rem; }
  .game-card { gap: .75rem; padding: .75rem; }
  .game-card h3 { margin-top: .2rem; }
  .game-card .thumbnail { width: 50px; font-size: .88rem; }
  .activity-top { padding: .85rem .9rem; }
  .two-up:not(.folder-grid):not(.map-choices) { grid-template-columns: minmax(0, 1fr); }
  .folder-button { flex-wrap: wrap; }
  .folder-count { margin-left: 0; }
}
@media (max-width: 340px) {
  .folder-grid, .map-choices { grid-template-columns: 1fr; }
}


  </style>
</head>

  <header class="masthead">
    <div class="shell">
      <a class="wordmark" href="#"><span class="brand-mark" aria-hidden="true"></span>세계대전 기록실</a>
      <a class="btn" id="list-link" href="#" hidden>게임 목록</a>
    </div>
  </header>
  <main id="main" class="shell" tabindex="-1">

function escapeText(value) {
  const replacements = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return String(value).replace(/[&<>"']/g, (character) => replacements[character]);
}

function sourceLink(id, label) {
  const [title, url] = sources[id];
  return '<a class="inline-source" href="' + escapeText(url) +
    '" target="_blank" rel="noopener noreferrer">' + escapeText(label || title) + '</a>';
}

function renderCredits(ids) {
  document.querySelector('#source-list').innerHTML =
    ids.map((id) => '<li>' + sourceLink(id) + '</li>').join('');
}

function focusHeading(root) {
  root.querySelector('h1').focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

function currentGame() {
  const id = location.hash.slice(1);
  return Object.hasOwn(games, id) ? id : null;

function report(id, text, good = false) {
  messages[id] = { text, good };
  announcer.textContent = text;
}

function clearMessage(id) {
  delete messages[id];
  announcer.textContent = '';
}

function message(id) {
  const feedback = messages[id];
  return feedback ? `<p class="feedback${feedback.good ? ' good' : ''}">${escapeText(feedback.text)}</p>` : '';
}

function finish(id, result) {
  results[id] = result;
  completed.add(id);
  clearMessage(id);
  try {
    localStorage.setItem(progressKey, JSON.stringify([...completed]));
  } catch {
    // Completion remains available in this tab.
  }
  redraw();
  document.querySelector('#task-focus').focus();
  announcer.textContent = '미션을 완료했습니다. 전시 기록과 해설을 확인하세요.';
}

        <button id="folder-${id}" class="btn folder-button" type="button" data-action="document-folder" data-value="${id}">
          ${title}<span class="folder-count">${placed.length}장</span>
        </button>
        ${placed.length ? `<ul class="placed">${placed.map((piece) => `<li>${escapeText(piece.text)}</li>`).join('')}</ul>` :
          '<p>여기에 조각을 넣으세요.</p>'}
      </section>`;
    }).join('')}</div>
    ${message('documents')}
    <button id="check-documents" class="btn primary action-row" type="button" data-action="document-check">배치 확인</button>
    <div class="sources">${sourceLink('borders', '베르사유 조약')} ${sourceLink('league', '국제연맹')}</div>
  </section>`;
}

function renderTestimony() {
  const testimony = state.testimony;
  if (testimony.checked) return `<section class="task">
    <h2 id="task-focus" tabindex="-1">두 근거로 피해를 설명하기</h2>
    <div class="two-up">
      <section class="panel"><h3>당사자의 증언</h3><p>김학순은 자신이 겪은 피해를 실명으로 공개했어요.</p></section>
      <section class="panel"><h3>일본 정부의 기록</h3><p>위안소 제도에 일본군이 관여했음을 공식적으로 밝혔어요.</p></section>
    </div>
    <p class="map-instructions">전시 설명에 덧붙일 문장으로 알맞은 것을 고르세요.</p>
    <div class="choice-list">
      ${choice('right-vote', 'testimony-right', 'vote', '이 기록은 선거에서 투표하는 방법이 달라졌음을 보여 줘요.', false)}
      ${choice('right-body', 'testimony-right', 'body', '이 사례는 자신의 몸과 삶을 스스로 결정할 권리가 침해되었음을 보여 줘요.', false)}
      ${choice('right-government', 'testimony-right', 'government', '정부의 발표만으로 피해자가 겪은 일을 모두 알 수 있어요.', false)}
    </div>
    ${message('testimony')}
  </section>`;

  return `<section class="task">
    <h2 id="task-focus" tabindex="-1">전시 설명에 넣을 근거 찾기</h2>
    <p>두 자료에서 질문에 답하는 대목을 한 곳씩 누르세요. 피해는 전쟁 중에 일어났고, 두 자료는 전쟁 뒤에 남겨졌습니다.</p>
    <div class="two-up action-row">${testimonyMaterials.map((item) => `
      <section class="panel">
        <h3>${escapeText(item.title)}</h3>
        <p class="map-instructions">${escapeText(item.task)}</p>
        <div class="choice-list">${item.choices.map(([id, label, text]) =>
          choice('evidence-' + item.id + '-' + id, 'testimony-line', item.id + ':' + id, text, testimony.selections[item.id] === id, label)
        ).join('')}</div>
        <p class="quotation">${escapeText(item.note)}</p>
        <small>${sourceLink(item.source, '자료 출처 보기')}</small>
      </section>
    `).join('')}</div>
    ${message('testimony')}
    <button id="check-testimony" class="btn primary action-row" type="button" data-action="testimony-check">근거 확인</button>
  </section>`;
}

function renderPeace() {
  const peace = state.peace;
  const open = records[peace.open];
  const ready = Boolean(peace.files.recovery && peace.files.peace);
  return `<section class="task">
    <h2 id="task-focus" tabindex="-1">기록을 열고 조사 결과에 붙이기</h2>
    <p>인권 회복에 관한 기록 하나와 평화에 관한 기록 하나를 조사하세요. 누가 무엇을 했는지 확인한 뒤 알맞은 파일에 넣으세요.</p>
    <div class="record-list">${Object.entries(records).map(([id, item]) =>
      choice('record-' + id, 'peace-open', id, item.title, peace.open === id, item.date)
    ).join('')}</div>
    ${open ? `<section class="panel record-detail">
      <h3>${escapeText(open.title)}</h3>
      <ul>
        <li><b>누가</b> · ${escapeText(open.who)}</li>
        <li><b>한 일</b> · ${escapeText(open.action)}</li>
        <li><b>해결하려 한 문제</b> · ${escapeText(open.purpose)}</li>
      </ul>
      <small>${sourceLink(open.source, '기록 원문·출처')}</small>
      <div class="row action-row">${Object.entries(recordFolders).map(([id, title]) =>
        `<button id="record-file-${id}" type="button" class="btn" data-action="peace-file" data-value="${id}">${title}에 넣기</button>`
      ).join('')}</div>
    </section>` : ''}
    <div class="two-up">${Object.entries(recordFolders).map(([id, title]) => `
      <section class="panel"><h3>${title}</h3>
        <p>${peace.files[id] ? escapeText(records[peace.files[id]].title) : '조사한 기록을 기다리고 있어요.'}</p>
      </section>
    `).join('')}</div>
    ${ready ? `<form class="note-form" id="peace-note-form">
      <label for="peace-note">이 기록을 읽고, 피해 회복이나 평화를 위해 앞으로 어떤 일이 필요하다고 생각했나요?</label>
      <p id="note-help">고른 기록 한 가지를 근거로 한 문장 쓰세요.</p>
      <textarea id="peace-note" name="peace-note" aria-describedby="note-help" rows="3" maxlength="180" required>${escapeText(peace.note)}</textarea>
      <button id="finish-peace" class="btn primary action-row" type="submit">전시 기록 완성</button>
    </form>` : ''}
    ${message('peace')}
  </section>`;
}

const activities = { map: renderMap, documents: renderDocuments, testimony: renderTestimony, peace: renderPeace };

function renderResult(id) {
  const result = results[id];
  return `<section class="completion">
    <span class="pill">미션 완료</span>
    <h2 id="task-focus" tabindex="-1">전시 기록을 남겼어요</h2>
    <p class="record-caption">${escapeText(result.record)}</p>
    <div class="result-explain"><h3>해설</h3><p>${escapeText(result.explanation)}</p></div>
    ${result.note ? `<div class="result-explain"><h3>내가 생각한 다음 노력</h3><p class="record-caption">${escapeText(result.note)}</p></div>` : ''}
    <div class="result-sources">${result.sources.map((sourceId) => sourceLink(sourceId)).join('')}</div>
    <div class="row action-row"><a class="btn primary" href="#">게임 목록</a>
      <button id="again" type="button" class="btn" data-action="restart">다시 하기</button>
      <button type="button" class="btn" data-action="credits">AI 활용 및 출처</button>
    </div>
  </section>`;
}

function redraw() {
  const id = currentGame();
  const game = games[id];
  main.innerHTML = game ? `<div class="activity">
    <header class="activity-top"><p class="eyebrow">${game.lesson}차시 · ${game.tag}</p>
      <h1 tabindex="-1">${escapeText(game.title)}</h1><p>${escapeText(game.action)}</p>
    </header>${results[id] ? renderResult(id) : activities[id]()}</div>` : renderHome();
}

function openGame() {
  const id = currentGame();
  document.querySelector('#list-link').hidden = !id;
  document.title = id ? games[id].title + ' · 세계대전 기록실' : '세계대전 기록실 · 학생용';
  announcer.textContent = '';
  redraw();
  focusHeading(main);
}

function selectMapPoint(value) {
  const map = state.map;
  if (!mapPoints[map.period].some((point) => point.id === value)) return;
  map.point = value;
  if (map.period === 'before') {
    if (value === 'empire') {
      map.checkedBefore = true;
      report('map', '전쟁 전 지도에서 한 제국을 찾았어요. 이제 ‘전쟁 후 · 1920년’을 눌러 국경을 비교하세요.', true);
    } else report('map', '전쟁 전 지도에서 붉은색으로 표시된 넓은 지역을 찾아보세요.');
    return;
  }
  if (!map.checkedBefore) {
    report('map', '먼저 전쟁 전 지도를 열고 오스트리아·헝가리 제국을 확인해 주세요.');
    return;
  }
  if (value !== 'czechoslovakia') {
    report('map', '옛 제국의 북쪽, 전쟁 뒤 지도에서 오스트리아 바로 위에 있는 새 나라를 살펴보세요.');
    return;
  }
  finish('map', {
    record: '1914년 지도에는 오스트리아·헝가리 제국이 있었다. 전쟁 뒤 제국이 해체되었고 1920년 지도에는 체코슬로바키아 같은 새 나라가 나타난다.',
    explanation: '전쟁 전후의 국경을 비교하면, 전쟁으로 한 제국의 힘이 약해지고 여러 나라의 경계가 다시 정해졌다는 점을 확인할 수 있어요.',
    sources: ['borders', 'map']
  });
}

function fileDocument(value) {
  const doc = state.documents;
  if (!doc.selected) {
    report('documents', '옮길 문서 조각을 먼저 누르세요.');
    return;
  }
  doc.placements[doc.selected] = value;
  doc.selected = '';
  report('documents', '조각을 옮겼어요. 배치를 모두 마치면 확인할 수 있어요.', true);
}

function checkDocuments() {
  const doc = state.documents;
  if (Object.keys(doc.placements).length < pieces.length) {
    report('documents', '문서 조각 네 장을 모두 넣은 뒤 확인해 주세요.');
    return;
  }
  if (pieces.some((piece) => doc.placements[piece.id] !== piece.folder)) {
    report('documents', '독일 한 나라에 부과한 조건과 여러 나라가 함께 지키려 한 약속을 다시 구분해 보세요.');
    return;
  }
  doc.checked = true;
  clearMessage('documents');
}

function checkTestimony() {
  const testimony = state.testimony;
  if (!testimony.selections.witness || !testimony.selections.government) {
    report('testimony', '두 자료에서 각각 한 대목을 골라 주세요.');
    return;
  }
  if (testimony.selections.witness !== 'experience') {
    report('testimony', '자료 A에서 날짜와 장소를 설명하는 문장 옆에 있는 김학순의 직접 발언을 살펴보세요.');
    return;
  }
  if (testimony.selections.government !== 'military') {
    report('testimony', '자료 B에서 일본군이 위안소를 설치하고 관리하는 데 어떤 역할을 했는지 알려 주는 문장을 찾아보세요.');
    return;
  }
  testimony.checked = true;
  clearMessage('testimony');
}

function filePeaceRecord(value) {
  const peace = state.peace;
  const record = records[peace.open];
  if (record.category !== value) {
    report('peace', '이 기록은 ' + (record.category === 'recovery' ? '피해를 기억하거나 피해를 회복하려는 노력' : '나라 사이 갈등을 평화롭게 해결하려는 약속') + '을 보여 줘요. 그 목적에 알맞은 파일을 골라 보세요.');
    return;
  }
  peace.files[value] = peace.open;
  report('peace', record.title + '을(를) 조사 결과에 넣었어요.', true);
}

const actions = {
  'map-period': (value) => {
    state.map.period = value;
    state.map.point = '';
    clearMessage('map');
  },
  'map-point': selectMapPoint,
  'document-piece': (value) => {
    state.documents.selected = state.documents.selected === value ? '' : value;
    clearMessage('documents');
  },
  'document-folder': fileDocument,
  'document-check': checkDocuments,
  'document-conclusion': (value) => {
    if (value !== 'limited') {
      report('documents', '미국이 국제연맹에 가입한 적이 있었는지 기록에서 다시 확인해 보세요.');
      return;
    }
    finish('documents', {
      record: '베르사유 조약으로 독일은 배상과 군비 제한을 요구받았다. 국제연맹은 여러 나라가 함께 분쟁을 해결하려 했지만, 미국은 가입하지 않았다.',
      explanation: '평화를 지키려면 국제기구의 목표와 함께 어떤 나라들이 참여하고 협력하는지도 중요해요.',
      sources: ['borders', 'league', 'usLeague']
    });
  },
  'testimony-line': (value) => {
    const [item, line] = value.split(':');
    state.testimony.selections[item] = line;
    clearMessage('testimony');
  },
  'testimony-check': checkTestimony,
  'testimony-right': (value) => {
    if (value !== 'body') {
      report('testimony', '당사자의 피해 경험과 일본군이 위안소 운영에 관여했다는 기록을 함께 생각해 보세요.');
      return;
    }
    finish('testimony', {
      record: '김학순은 자신이 겪은 일본군 ‘위안부’ 피해를 공개 증언했다. 일본 정부의 담화는 일본군이 위안소 설치·관리와 이송에 관여했음을 보여 준다. 이 사례에서 피해자들은 자신의 몸과 삶을 스스로 결정할 권리를 침해당했다.',
      explanation: '증언에서는 실제 피해를 겪은 사람의 목소리를 들을 수 있고, 담화에서는 일본군의 관여에 관한 일본 정부의 조사 결과를 확인할 수 있어요.',
      sources: ['testimony', 'kono']
    });
  },
  'peace-open': (value) => {
    state.peace.open = value;
    clearMessage('peace');
  },
  'peace-file': filePeaceRecord,
  restart: () => {
    const id = currentGame();
    state[id] = makeState()[id];
    delete results[id];
    clearMessage(id);
  },
  credits: () => {
    const credits = document.querySelector('.credits');
    credits.querySelector('details').open = true;
    credits.querySelector('h2').focus();
  }
};

main.addEventListener('click', (event) => {
  const button = event.target.closest('button[data-action]');
  if (!button) return;
  const action = button.dataset.action;
  if (!Object.hasOwn(actions, action)) return;
  const id = currentGame();
  actions[action](button.dataset.value);
  if (action === 'credits' || results[id]) return;
  redraw();
  const target = document.getElementById(button.id) || document.querySelector('#task-focus');
  target?.focus({ preventScroll: Boolean(document.getElementById(button.id)) });
});

main.addEventListener('input', (event) => {
  if (event.target.id === 'peace-note') state.peace.note = event.target.value;
});

main.addEventListener('submit', (event) => {
  if (event.target.id !== 'peace-note-form') return;
  event.preventDefault();
  const peace = state.peace;
  const note = peace.note.trim();
  if (!note) {
    report('peace', '기록을 근거로 내가 생각한 일을 한 문장 적어 주세요.');
    redraw();
    document.querySelector('#peace-note').focus();
    return;
  }
  const recovery = records[peace.files.recovery];
  const agreement = records[peace.files.peace];
  finish('peace', {
    record: recovery.who + ' · ' + recovery.action + '\n' + agreement.who + ' · ' + agreement.action,
    explanation: recovery.purpose + ' 국제연합 헌장은 나라들이 분쟁을 평화적으로 해결하는 원칙을 세웠어요. ' + recovery.next,
    note,
    sources: [recovery.source, agreement.source]
  });
});

document.querySelector('.skip').addEventListener('click', (event) => {
  event.preventDefault();
  focusHeading(main);
});

renderCredits(['curriculum', 'borders', 'map', 'league', 'usLeague', 'testimony', 'kono', 'archive', 'report', 'charter', 'versailles']);
window.addEventListener('hashchange', openGame);
openGame();

  </script>
